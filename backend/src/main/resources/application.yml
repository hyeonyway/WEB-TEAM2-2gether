spring:
  application:
    name: dbidding

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbidding}?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

  jpa:
    # 테이블은 schema.sql로 직접 관리하므로 JPA가 생성/변경하지 않게 함
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  sql:
    init:
      # schema.sql은 앱이 자동 실행하지 않음 (최초 1회 수동 실행 방식 - DB_SETUP.md 참고)
      mode: never

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: ${SESSION_COOKIE_NAME:SESSION}
        http-only: true
        secure: ${SESSION_SECURE_COOKIE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}

  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s

logging:
  slack:
    webhook-url: ${SLACK_LOG_WEBHOOK_URL:}
    environment: ${SPRING_PROFILES_ACTIVE:default}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AUCTION_IMAGE_BUCKET:}
      presign-duration-seconds: ${AUCTION_IMAGE_PRESIGN_DURATION_SECONDS:300}
app:
  auth:
    mode: ${AUTH_MODE:jwt}
    session-enabled: ${SESSION_AUTH_ENABLED:false}
  session:
    store: ${SESSION_STORE:}
    cookie-name: ${SESSION_COOKIE_NAME:SESSION}
    secure-cookie: ${SESSION_SECURE_COOKIE:true}
    same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  jwt:
    secret: ${JWT_SECRET}
    access-token-seconds: ${JWT_ACCESS_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_SECONDS:604800}
    secure-cookie: ${JWT_SECURE_COOKIE:true}
