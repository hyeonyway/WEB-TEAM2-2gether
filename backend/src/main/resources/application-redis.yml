spring:
  data:
    redis:
      # XREADGROUP BLOCK(기본 1초)보다 길어야 빈 Stream 대기가 command timeout으로 실패하지 않는다.
      timeout: ${AUCTION_REDIS_COMMAND_TIMEOUT:2s}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: ${AUCTION_REDIS_BID_JDBC_BATCH_SIZE:100}
        order_inserts: true
        order_updates: true

app:
  auction:
    redis-bid:
      block: ${AUCTION_REDIS_BID_BLOCK:1s}
      claim-idle: ${AUCTION_REDIS_BID_CLAIM_IDLE:30s}
      # DLQ 재시도에는 더 이상 사용하지 않지만 기존 프로필 설정과의 호환성을 유지한다.
      max-retries: ${AUCTION_REDIS_BID_MAX_RETRIES:3}
      # 단일 timeline queue는 leader lock을 획득한 하나의 Consumer만 순차 처리한다.
      consumer-lock-at-most-for: ${AUCTION_REDIS_BID_CONSUMER_LOCK_AT_MOST_FOR:5m}
      # 한 번의 blocking read 후 단건씩 처리할 최대 이벤트 수. 각 이벤트는 별도 DB 트랜잭션과 ACK를 사용한다.
      # inbox에 결과가 기록된 Stream 레코드는 ACK와 XDEL로 즉시 제거한다.
      max-records-per-run: ${AUCTION_REDIS_BID_MAX_RECORDS_PER_RUN:100}

auction:
  catchup-verification:
    # 여러 엔티티가 동시에 콜드미스 나도 전역 캐치업 여부는 이 주기로만 재확인한다.
    cache-ttl: ${AUCTION_CATCHUP_CACHE_TTL:PT0.5S}
  active-index:
    cleanup:
      fixed-delay-ms: ${AUCTION_ACTIVE_INDEX_CLEANUP_FIXED_DELAY_MS:3600000}
      stale-after: ${AUCTION_ACTIVE_INDEX_CLEANUP_STALE_AFTER:PT24H}
      batch-size: ${AUCTION_ACTIVE_INDEX_CLEANUP_BATCH_SIZE:100}
  bidder-state:
    cleanup:
      # auction:state가 이미 사라진 auction:bidder:*/auction:dashboard:participating:* 잔여 항목을
      # SCAN으로 순회해 정리한다 - 입찰 hot path(bid-accept.lua)는 건드리지 않는 안전망 방식이다.
      fixed-delay-ms: ${AUCTION_BIDDER_STATE_CLEANUP_FIXED_DELAY_MS:3600000}
      # 정상적인 1회 실행 상한이 아니라, 매칭 키가 폭증했을 때만 브레이크를 거는 안전 상한이다 -
      # 이보다 작게 잡으면 매칭 키 수가 이 값을 넘는 순간부터 매 실행이 커서 0에서 다시 시작해
      # 항상 같은 앞부분만 훑고 뒤쪽 orphan 키에는 영원히 도달하지 못한다.
      scan-limit: ${AUCTION_BIDDER_STATE_CLEANUP_SCAN_LIMIT:1000000}
      batch-size: ${AUCTION_BIDDER_STATE_CLEANUP_BATCH_SIZE:200}
      # participating은 SET이라 키 하나당 비용이 멤버 수에 비례한다 - flat 키(bidder/recent-bids)
      # 배치보다 훨씬 작게 잡아 GC Lua 호출 1회가 Redis를 오래 블로킹하지 않게 한다.
      participating-batch-size: ${AUCTION_BIDDER_STATE_CLEANUP_PARTICIPATING_BATCH_SIZE:20}
  state-seeding:
    warm-up:
      enabled: ${AUCTION_STATE_WARM_UP_ENABLED:true}
      # 활성(OPEN/ENDING) 경매를 전부 warm-up한다 - 어떤 정렬 기준으로도 목록 커버리지 문제가
      # 생기지 않는다. 이 값은 실제 캡이 아니라, 예상 밖 급증으로 기동이 무한정 오래 걸리는 것만
      # 막는 안전 상한이다.
      max-active-auctions: ${AUCTION_STATE_WARM_UP_MAX_ACTIVE_AUCTIONS:50000}
    auction-cold-batch:
      # 서로 다른 auctionId의 동시 콜드시드를 이 시간(ms) 동안 모아 배치 쿼리 1회로 묶는다.
      # wallet-cold-batch와 동일한 트레이드오프 — 경합 없는 단독 요청도 이만큼 기다린다.
      window-ms: ${AUCTION_COLD_SEED_BATCH_WINDOW_MS:5}
      max-batch-size: ${AUCTION_COLD_SEED_MAX_BATCH_SIZE:200}
    wallet-cold-batch:
      # 서로 다른 userId의 동시 콜드시드를 이 시간(ms) 동안 모아 배치 쿼리 1회로 묶는다.
      # 경합이 없는 단독 요청도 이 시간만큼은 기다리게 되는 지연 하한선이다.
      window-ms: ${WALLET_COLD_SEED_BATCH_WINDOW_MS:5}
      # 윈도우가 끝나기 전이라도 이 크기에 도달하면 즉시 flush한다.
      max-batch-size: ${WALLET_COLD_SEED_MAX_BATCH_SIZE:200}

order:
  state-index:
    cleanup:
      # order:state:buyer/seller:{userId} Set은 SREM 로직이 없어 order:state가 이미 사라진
      # auctionId가 그대로 쌓인다 - SCAN으로 순회해 안전망으로 정리한다.
      fixed-delay-ms: ${ORDER_STATE_INDEX_CLEANUP_FIXED_DELAY_MS:3600000}
      # 정상적인 1회 실행 상한이 아니라, 매칭 키가 폭증했을 때만 브레이크를 거는 안전 상한이다 -
      # 이보다 작게 잡으면 매칭 키 수가 이 값을 넘는 순간부터 매 실행이 커서 0에서 다시 시작해
      # 항상 같은 앞부분만 훑고 뒤쪽 orphan 키에는 영원히 도달하지 못한다.
      scan-limit: ${ORDER_STATE_INDEX_CLEANUP_SCAN_LIMIT:1000000}
      # buyer/seller 인덱스는 SET이라 키 하나당 비용이 멤버 수에 비례한다 - 작게 잡아 GC Lua
      # 호출 1회가 Redis를 오래 블로킹하지 않게 한다.
      batch-size: ${ORDER_STATE_INDEX_CLEANUP_BATCH_SIZE:20}
