spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbidding}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:dbidding}
    password: ${DB_PASSWORD:dbidding}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  flyway:
    enabled: true

  test:
    database:
      replace: none

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: test-only-bucket
      presign-duration-seconds: 300

app:
  session:
    # 단위·MySQL 통합 테스트는 Redis session listener 대신 MockHttpSession을 사용한다.
    store: memory
    cookie-name: SESSION
    secure-cookie: false
    same-site: lax
