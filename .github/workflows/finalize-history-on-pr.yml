name: Finalize migrated history on migration PR

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'chore/github-history-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: softeerbootcamp-8th/WEB-TEAM2-2gether
      TARGET_REPO: hyeonyway/WEB-TEAM2-2gether
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/github-history-migration
          fetch-depth: 1
      - name: Remove duplicate archives and verify exact coverage
        run: python3 scripts/dedupe-migration-history.py
