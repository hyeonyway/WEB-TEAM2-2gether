name: Finalize migrated GitHub history once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-history-once.yml

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: softeerbootcamp-8th/WEB-TEAM2-2gether
      TARGET_REPO: hyeonyway/WEB-TEAM2-2gether
      FINALIZE_RETRY: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/github-history-migration
          fetch-depth: 1
      - name: Remove duplicate archives and verify
        run: python3 scripts/dedupe-migration-history.py
