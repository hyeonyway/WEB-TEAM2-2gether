name: Finalize GitHub history migration

on:
  push:
    branches:
      - chore/github-history-migration
    paths:
      - .github/workflows/finalize-github-history-migration.yml

concurrency:
  group: github-history-migration-finalize
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: softeerbootcamp-8th/WEB-TEAM2-2gether
      TARGET_REPO: hyeonyway/WEB-TEAM2-2gether
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/github-history-migration
          fetch-depth: 1

      - name: Remove duplicate archives and verify exact coverage
        run: python3 scripts/dedupe-migration-history.py

      - name: Show final target count
        if: always()
        run: |
          gh api --paginate --slurp "repos/$TARGET_REPO/issues?state=all&per_page=100" \
            --jq '[.[][] | select(.pull_request == null)] | length'
