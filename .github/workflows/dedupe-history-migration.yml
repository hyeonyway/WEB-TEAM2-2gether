name: Deduplicate migrated GitHub history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dedupe-history-migration.yml

permissions:
  contents: read
  issues: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Find duplicate migration markers
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/issues?state=all&per_page=100" > /tmp/pages.json
          python3 <<'PY' > /tmp/duplicates.tsv
          import json, re
          pages = json.load(open('/tmp/pages.json'))
          issues = [i for page in pages for i in page if 'pull_request' not in i]
          rx = re.compile(r'<!-- github-history-migration:(?:issue|pr):[^>]+ -->')
          groups = {}
          for i in issues:
              m = rx.search(i.get('body') or '')
              if not m:
                  continue
              groups.setdefault(m.group(0), []).append(i)
          duplicates = 0
          for marker, items in sorted(groups.items()):
              items.sort(key=lambda x: x['number'])
              for i in items[1:]:
                  print(f"{i['number']}\t{i['node_id']}\t{marker}")
                  duplicates += 1
          print(f"unique_markers={len(groups)} duplicates={duplicates}", file=__import__('sys').stderr)
          PY

          echo "Duplicate rows: $(wc -l < /tmp/duplicates.tsv)"

      - name: Delete duplicates
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          failed=0
          while IFS=$'\t' read -r number node_id marker; do
            [ -n "${number:-}" ] || continue
            echo "Deleting duplicate issue #$number ($marker)"
            if gh api graphql \
              -f query='mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}' \
              -f id="$node_id" >/dev/null; then
              deleted=$((deleted + 1))
            else
              echo "Delete failed for #$number; closing as duplicate instead" >&2
              gh api --method PATCH "repos/$REPO/issues/$number" \
                -f state=closed -f state_reason=duplicate >/dev/null || true
              failed=$((failed + 1))
            fi
          done < /tmp/duplicates.tsv
          echo "Deleted: $deleted; fallback-closed: $failed"
