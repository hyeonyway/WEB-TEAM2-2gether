name: Migrate GitHub history

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-github-history.yml

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: softeerbootcamp-8th/WEB-TEAM2-2gether
      TARGET_REPO: hyeonyway/WEB-TEAM2-2gether
      TARGET_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/github-history-migration
          fetch-depth: 0

      - name: Migrate all issues and PR history
        run: bash scripts/migrate-github-history.sh --apply

      - name: Show API rate limit
        if: always()
        run: gh api rate_limit --jq '.resources.core | {limit, remaining, reset}'
