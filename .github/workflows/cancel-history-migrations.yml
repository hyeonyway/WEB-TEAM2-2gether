name: Cancel and dedupe history migrations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-history-migrations.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel active migration runs
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api --paginate "repos/$REPO/actions/workflows/migrate-github-history.yml/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[].id' |
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done

      - name: Build duplicate list
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/issues?state=all&per_page=100" > /tmp/pages.json
          python3 <<'PY' > /tmp/duplicates.tsv
          import json, re, sys
          pages = json.load(open('/tmp/pages.json'))
          issues = [i for page in pages for i in page if 'pull_request' not in i]
          rx = re.compile(r'<!-- github-history-migration:(?:issue|pr):[^>]+ -->')
          groups = {}
          for i in issues:
              m = rx.search(i.get('body') or '')
              if m:
                  groups.setdefault(m.group(0), []).append(i)
          duplicate_count = 0
          for marker, items in sorted(groups.items()):
              items.sort(key=lambda x: x['number'])
              for i in items[1:]:
                  print(f"{i['number']}\t{i['node_id']}\t{marker}")
                  duplicate_count += 1
          print(f"unique_markers={len(groups)} duplicates={duplicate_count}", file=sys.stderr)
          PY
          cat /tmp/duplicates.tsv | head -20 || true
          echo "duplicates=$(wc -l < /tmp/duplicates.tsv)"

      - name: Delete duplicate migration issues
        shell: bash
        run: |
          set -u
          deleted=0
          fallback=0
          while IFS=$'\t' read -r number node_id marker; do
            [ -n "${number:-}" ] || continue
            if gh api graphql \
                -f query='mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}' \
                -f id="$node_id" >/dev/null 2>&1; then
              echo "deleted duplicate #$number"
              deleted=$((deleted+1))
            else
              echo "delete unavailable; marking duplicate #$number" >&2
              gh api --method PATCH "repos/$REPO/issues/$number" \
                -f state=closed -f state_reason=duplicate >/dev/null || true
              fallback=$((fallback+1))
            fi
          done < /tmp/duplicates.tsv
          echo "deleted=$deleted fallback_closed=$fallback"
