name: Resume GitHub history migration

on:
  push:
    branches:
      - chore/github-history-migration
    paths:
      - .github/workflows/resume-github-history-migration.yml

concurrency:
  group: github-history-migration-single
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: softeerbootcamp-8th/WEB-TEAM2-2gether
      TARGET_REPO: hyeonyway/WEB-TEAM2-2gether
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/github-history-migration
          fetch-depth: 0

      - name: Complete missing issues
        run: python3 scripts/complete-missing-issues.py

      - name: Complete missing PR archives
        run: python3 scripts/fast-rest-migrate-prs.py

      - name: Remove duplicate archives and verify
        run: python3 scripts/dedupe-migration-history.py

      - name: Show API rate limit
        if: always()
        run: gh api rate_limit --jq '.resources | {core:.core, graphql:.graphql}'
